{# Model metrics, filled from GET /api/metrics/ by static/js/metrics.js. No numbers are written here. #}
<section class="panel" aria-labelledby="metrics-title" data-metrics-panel>
  <div class="panel-head">
    <h2 id="metrics-title">Model evaluation</h2>
    <span class="muted small" data-metrics-meta></span>
  </div>
  <div data-metrics-body>
    <div class="state" role="status">
      <div class="spinner-border spinner-border-sm text-secondary" aria-hidden="true"></div>
      <div class="state-title">Loading the latest evaluation…</div>
    </div>
  </div>
</section>
